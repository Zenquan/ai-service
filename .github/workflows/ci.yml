name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ── 客服任务离线评测：核心门禁，纯 mock 工具 + 确定性分类器，不依赖 Qdrant/LLM/MySQL ──
  offline-eval:
    name: 客服离线评测（阈值门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装后端依赖（不含 fastembed，离线评测无需本地向量化）
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: 跑客服任务离线评测（阈值门禁）
        run: |
          python -m server.cli cs-eval --fail-under 0.9

      - name: 跑红队安全评测（阈值门禁）
        run: |
          python -m server.cli cs-redteam --fail-under 0.9

      - name: 跑离线评测与图契约单测
        run: |
          python -m pytest \
            tests/test_offline_eval.py \
            tests/test_graph_customer_service.py \
            tests/test_order_tool_closure.py \
            tests/test_llm_classifier.py \
            tests/test_multi_intent.py \
            tests/test_metrics_recorder.py \
            tests/test_alerts.py \
            tests/test_redactor.py \
            tests/test_redact_middleware.py \
            tests/test_rate_limit.py \
            tests/test_circuit_breaker.py \
            tests/test_audit_log.py \
            tests/test_redteam.py \
            -q --tb=short

  # ── 前端类型检查：保证告警面板等改动不引入类型错误 ──
  frontend-typecheck:
    name: 前端类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 类型检查
        run: pnpm exec tsc --noEmit -p tsconfig.app.json
