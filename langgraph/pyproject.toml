[project]
name = "langgraph-graph"
version = "0.1.0"
description = "RAG 产品 · LangGraph 图编排层：检索 → rerank → 生成 → 引用校验，复用 rag 核心，支持 LangGraph CLI / LangSmith"
readme = "README.md"
# 与根 workspace 保持一致：锁定 Python 3.12（因 rag 依赖 fastembed→onnxruntime 无 3.13/3.14 wheel）
requires-python = ">=3.10,<3.13"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

# rag 为核心的可选依赖：默认「独立安装/测试」不要求（rag 在节点内延迟导入，缺失时优雅降级）；
# 需要跑完整 RAG 链路时用 `pip install -e ".[rag]"`，或在 uv workspace 下由根 pyproject 统一解析。
[project.optional-dependencies]
rag = ["rag"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 作为根 pyproject 的 uv workspace 子成员（根已声明 members=["langgraph"]）
[tool.uv]
package = true
